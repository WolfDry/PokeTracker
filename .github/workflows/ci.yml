# Vérifications à chaque push / pull request : lint et types.
# Le build complet (`next build`) a besoin de la base (pré-rendu des Pokédex) : il est fait par Vercel.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
